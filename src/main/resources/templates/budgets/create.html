<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>New Budget - SplitFriend</title>
</head>
<body>
<div th:replace="~{layout/main :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4" th:text="#{budget.create.title}">New Budget</h3>

                    <div th:if="${#lists.isEmpty(candidates)}" class="alert alert-warning" th:text="#{budget.create.noCandidates}">
                        Nobody else has the budget feature enabled yet. Ask an administrator to enable it for the other person.
                    </div>

                    <form th:action="@{/budgets/create}" th:object="${budget}" method="post" th:unless="${#lists.isEmpty(candidates)}">
                        <div class="mb-3">
                            <label for="name" class="form-label"><span th:text="#{budget.form.name}">Name</span> *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:placeholder="#{budget.form.namePlaceholder}" required>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label" th:text="#{budget.form.description}">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="partnerId" class="form-label"><span th:text="#{budget.form.partner}">Shared with</span> *</label>
                            <select class="form-select" id="partnerId" th:field="*{partnerId}" required>
                                <option value="" th:text="#{common.select}">Select...</option>
                                <option th:each="c : ${candidates}" th:value="${c.id}" th:text="${c.name}">Name</option>
                            </select>
                            <small class="text-muted" th:text="#{budget.form.partnerHelp}">Only people with the budget feature enabled can be added.</small>
                        </div>

                        <div class="mb-3">
                            <label for="shareAPercent" class="form-label"><span th:text="#{budget.form.yourShare}">Your share</span> (%)</label>
                            <input type="number" step="0.01" min="0" max="100" class="form-control"
                                   id="shareAPercent" th:field="*{shareAPercent}" required>
                            <small class="text-muted" th:text="#{budget.form.shareHelp}">The other person covers the rest.</small>
                        </div>

                        <div class="mb-3">
                            <label for="settlementPeriod" class="form-label" th:text="#{budget.form.period}">Settlement period</label>
                            <select class="form-select" id="settlementPeriod" th:field="*{settlementPeriod}">
                                <option th:each="p : ${periods}" th:value="${p}" th:text="#{'budget.frequency.' + ${p}}">Bi-weekly</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="currency" class="form-label" th:text="#{common.currency}">Currency</label>
                            <select class="form-select" id="currency" th:field="*{currency}">
                                <option value="CAD">CAD</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" th:text="#{common.create}">Create</button>
                            <a th:href="@{/budgets}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
