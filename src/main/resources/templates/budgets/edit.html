<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>Edit Budget - SplitFriend</title>
</head>
<body>
<div th:replace="~{layout/main :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4" th:text="#{budget.edit.title}">Edit Budget</h3>

                    <form th:action="@{/budgets/{id}/edit(id=${budgetId})}" th:object="${budget}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label"><span th:text="#{budget.form.name}">Name</span> *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label" th:text="#{budget.form.description}">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{budget.form.participants}">Participants</label>
                            <p class="form-control-plaintext mb-0">
                                <span th:text="${userAName}">A</span>
                                <span class="text-muted">&amp;</span>
                                <span th:text="${userBName}">B</span>
                            </p>
                            <small class="text-muted" th:text="#{budget.form.participantsFixed}">Participants are fixed once a budget is created.</small>
                            <input type="hidden" th:field="*{partnerId}">
                        </div>

                        <div class="mb-3">
                            <label for="shareAPercent" class="form-label">
                                <span th:text="${userAName}">A</span>'s <span th:text="#{budget.form.share}">share</span> (%)
                            </label>
                            <input type="number" step="0.01" min="0" max="100" class="form-control"
                                   id="shareAPercent" th:field="*{shareAPercent}" required>
                            <small class="text-muted">
                                <span th:text="${userBName}">B</span>
                                <span th:text="#{budget.form.coversRest}">covers the rest.</span>
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="settlementPeriod" class="form-label" th:text="#{budget.form.period}">Settlement period</label>
                            <select class="form-select" id="settlementPeriod" th:field="*{settlementPeriod}">
                                <option th:each="p : ${periods}" th:value="${p}" th:text="#{'budget.frequency.' + ${p}}">Bi-weekly</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="currency" class="form-label" th:text="#{common.currency}">Currency</label>
                            <select class="form-select" id="currency" th:field="*{currency}">
                                <option value="CAD">CAD</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
                            <a th:href="@{/budgets/{id}(id=${budgetId})}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
