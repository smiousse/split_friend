<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>Add Expense - SplitFriend</title>
</head>
<body>
<div th:replace="~{layout/main :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4" th:text="#{expense.add.title(${group.name})}">Add Expense to Group</h3>

                    <form th:action="@{/expenses/add}" th:object="${expense}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{groupId}">

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="description" class="form-label"><span th:text="#{expense.description}">Description</span> *</label>
                                <input type="text" class="form-control" th:class="${#fields.hasErrors('description')} ? 'form-control is-invalid' : 'form-control'"
                                       id="description" th:field="*{description}" th:placeholder="#{expense.descriptionPlaceholder}" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="amount" class="form-label"><span th:text="#{expense.amount}">Amount</span> *</label>
                                <div class="input-group">
                                    <span class="input-group-text" th:text="${group.currency}">$</span>
                                    <input type="number" step="0.01" min="0.01" class="form-control"
                                           th:class="${#fields.hasErrors('amount')} ? 'form-control is-invalid' : 'form-control'"
                                           id="amount" th:field="*{amount}" placeholder="0.00" required>
                                </div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="paidById" class="form-label"><span th:text="#{expense.paidBy}">Paid by</span> *</label>
                                <select class="form-select" id="paidById" th:field="*{paidById}" required>
                                    <option th:each="member : ${members}"
                                            th:value="${member.id}"
                                            th:text="${member.name}"
                                            th:selected="${member.id == expense.paidById}">Member</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="expenseDate" class="form-label" th:text="#{expense.date}">Date</label>
                                <input type="date" class="form-control" id="expenseDate" name="expenseDate"
                                       th:value="${expense.expenseDate != null ? #temporals.format(expense.expenseDate, 'yyyy-MM-dd') : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{expense.splitMode}">Sharing options</label>
                            <input type="hidden" id="splitMode" th:field="*{splitMode}">
                            <div class="d-grid gap-2" role="group" th:aria-label="#{expense.splitMode}">
                                <button type="button" class="btn btn-outline-primary split-mode-btn" data-mode="SPLIT"
                                        onclick="setSplitMode('SPLIT')" th:text="#{expense.splitMode.split}">Split the expense</button>
                                <button type="button" class="btn btn-outline-primary split-mode-btn" data-mode="I_OWE_ALL"
                                        onclick="setSplitMode('I_OWE_ALL')" th:text="#{expense.splitMode.iOweAll}">You owe the full amount</button>
                                <button type="button" class="btn btn-outline-primary split-mode-btn" data-mode="THEY_OWE_ALL"
                                        onclick="setSplitMode('THEY_OWE_ALL')" th:text="#{expense.splitMode.theyOweAll}">They owe the full amount</button>
                            </div>
                        </div>

                        <div class="mb-3" id="splitModeSummary" style="display:none;">
                            <div class="alert alert-light alert-permanent border mb-0 py-2 small">
                                <span id="summaryIOweAll" th:text="#{expense.splitMode.iOweAllSummary}">You owe the full amount of this expense.</span>
                                <span id="summaryTheyOweAll" th:text="#{expense.splitMode.theyOweAllSummary}">Everyone else owes the full amount to the payer.</span>
                            </div>
                        </div>

                        <div class="mb-3" id="splitTypeSection">
                            <label class="form-label"><span th:text="#{expense.splitType}">Split Type</span> *</label>
                            <input type="hidden" id="splitType" th:field="*{splitType}">
                            <div class="btn-group d-flex flex-wrap" role="group" th:aria-label="#{expense.splitType}">
                                <button type="button" class="btn btn-outline-secondary split-type-btn" data-type="EQUAL"
                                        th:title="#{expense.splitType.equal}" onclick="setSplitType('EQUAL')">
                                    <span aria-hidden="true">=</span>
                                    <span class="visually-hidden" th:text="#{expense.splitType.equal.short}">Equal</span>
                                </button>
                                <button type="button" class="btn btn-outline-secondary split-type-btn" data-type="EXACT"
                                        th:title="#{expense.splitType.exact}" onclick="setSplitType('EXACT')">
                                    <span aria-hidden="true">1.23</span>
                                    <span class="visually-hidden" th:text="#{expense.splitType.exact.short}">Amounts</span>
                                </button>
                                <button type="button" class="btn btn-outline-secondary split-type-btn" data-type="PERCENTAGE"
                                        th:title="#{expense.splitType.percentage}" onclick="setSplitType('PERCENTAGE')">
                                    <span aria-hidden="true">%</span>
                                    <span class="visually-hidden" th:text="#{expense.splitType.percentage.short}">Percent</span>
                                </button>
                                <button type="button" class="btn btn-outline-secondary split-type-btn" data-type="SHARES"
                                        th:title="#{expense.splitType.shares}" onclick="setSplitType('SHARES')">
                                    <span aria-hidden="true">1:2</span>
                                    <span class="visually-hidden" th:text="#{expense.splitType.shares.short}">Shares</span>
                                </button>
                            </div>
                            <div class="form-text">
                                <span class="split-type-desc" data-type="EQUAL" th:text="#{expense.splitType.equal}">Equal</span>
                                <span class="split-type-desc" data-type="EXACT" th:text="#{expense.splitType.exact}">Exact</span>
                                <span class="split-type-desc" data-type="PERCENTAGE" th:text="#{expense.splitType.percentage}">Percentage</span>
                                <span class="split-type-desc" data-type="SHARES" th:text="#{expense.splitType.shares}">Shares</span>
                            </div>
                        </div>

                        <div class="mb-3" id="participantsSection">
                            <label class="form-label"><span th:text="#{expense.splitAmong}">Split among</span> *</label>
                            <div class="card">
                                <div class="card-body" id="participantsList">
                                    <div th:each="member : ${members}" class="form-check mb-2 participant-row">
                                        <div class="row align-items-center">
                                            <div class="col-md-4">
                                                <input class="form-check-input" type="checkbox"
                                                       th:id="'participant_' + ${member.id}"
                                                       name="participantIds"
                                                       th:value="${member.id}" checked>
                                                <label class="form-check-label" th:for="'participant_' + ${member.id}"
                                                       th:text="${member.name}">Member</label>
                                            </div>
                                            <div class="col-md-8 split-input-container" style="display:none;">
                                                <div class="exact-input" style="display:none;">
                                                    <div class="input-group input-group-sm">
                                                        <span class="input-group-text">$</span>
                                                        <input type="number" step="0.01" min="0" class="form-control"
                                                               th:name="'exactAmount_' + ${member.id}" placeholder="0.00">
                                                    </div>
                                                </div>
                                                <div class="percentage-input" style="display:none;">
                                                    <div class="input-group input-group-sm">
                                                        <input type="number" step="0.01" min="0" max="100" class="form-control"
                                                               th:name="'percentage_' + ${member.id}" placeholder="0">
                                                        <span class="input-group-text">%</span>
                                                    </div>
                                                </div>
                                                <div class="shares-input" style="display:none;">
                                                    <div class="input-group input-group-sm">
                                                        <input type="number" step="1" min="0" class="form-control"
                                                               th:name="'shares_' + ${member.id}" placeholder="1" value="1">
                                                        <span class="input-group-text" th:text="#{expense.shares}">shares</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="bill" class="form-label" th:text="#{expense.bill}">Bill/Receipt (optional)</label>
                            <input type="file" class="form-control" id="bill" name="bill" accept="image/*,.pdf">
                            <small class="text-muted" th:text="#{expense.billHelp}">Upload a photo of the bill (max 10MB)</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" th:text="#{expense.addExpense}">Add Expense</button>
                            <a th:href="@{/groups/{id}(id=${group.id})}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
<script>
const SPLIT_MODE_SPLIT = 'SPLIT';
let lastSplitType = document.getElementById('splitType').value || 'EQUAL';

// Tolerates a missing node so one absent element cannot abort the refresh.
function setDisplay(id, value) {
    const element = document.getElementById(id);
    if (element) {
        element.style.display = value;
    }
}

function currentMode() {
    return document.getElementById('splitMode').value || SPLIT_MODE_SPLIT;
}

function currentSplitType() {
    return document.getElementById('splitType').value || 'EQUAL';
}

function memberCount() {
    return document.querySelectorAll('.participant-row').length;
}

function payerId() {
    return document.getElementById('paidById').value;
}

function setSplitMode(mode) {
    document.getElementById('splitMode').value = mode;

    if (mode === SPLIT_MODE_SPLIT) {
        document.getElementById('splitType').value = lastSplitType;
    } else {
        document.getElementById('splitType').value = 'EQUAL';
    }

    refreshSplitUI();
}

function setSplitType(type) {
    lastSplitType = type;
    document.getElementById('splitType').value = type;
    refreshSplitUI();
}

// Number of people the expense will actually be charged to, mirroring
// SplitModeResolver on the server.
function resolvedParticipantCount() {
    const mode = currentMode();

    if (mode === 'I_OWE_ALL') {
        return 1;
    }
    if (mode === 'THEY_OWE_ALL') {
        return Math.max(memberCount() - 1, 0);
    }
    return memberCount();
}

function updateModeButtons() {
    const mode = currentMode();
    document.querySelectorAll('.split-mode-btn').forEach(btn => {
        const active = btn.dataset.mode === mode;
        btn.classList.toggle('btn-primary', active);
        btn.classList.toggle('btn-outline-primary', !active);
    });

    const isSplit = mode === SPLIT_MODE_SPLIT;
    setDisplay('splitTypeSection', isSplit ? 'block' : 'none');
    setDisplay('splitModeSummary', isSplit ? 'none' : 'block');
    setDisplay('summaryIOweAll', mode === 'I_OWE_ALL' ? 'inline' : 'none');
    setDisplay('summaryTheyOweAll', mode === 'THEY_OWE_ALL' ? 'inline' : 'none');
}

function updateSplitTypeButtons() {
    const type = currentSplitType();
    document.querySelectorAll('.split-type-btn').forEach(btn => {
        const active = btn.dataset.type === type;
        btn.classList.toggle('btn-secondary', active);
        btn.classList.toggle('btn-outline-secondary', !active);
    });
    document.querySelectorAll('.split-type-desc').forEach(desc => {
        desc.style.display = desc.dataset.type === type ? 'inline' : 'none';
    });
}

// Per-participant inputs: only meaningful when sharing the expense.
function updateParticipantInputs() {
    const showInputs = currentMode() === SPLIT_MODE_SPLIT;
    const type = currentSplitType();

    document.querySelectorAll('.split-input-container').forEach(c => {
        c.style.display = (showInputs && type !== 'EQUAL') ? 'block' : 'none';
    });

    const byType = {EXACT: '.exact-input', PERCENTAGE: '.percentage-input', SHARES: '.shares-input'};
    Object.entries(byType).forEach(([splitType, selector]) => {
        document.querySelectorAll(selector).forEach(i => {
            i.style.display = (showInputs && type === splitType) ? 'block' : 'none';
        });
    });
}

// Hide the "Split among" block when a single person ends up paying the
// expense back, and hide the payer row when only the others owe.
function updateParticipantsVisibility() {
    setDisplay('participantsSection', resolvedParticipantCount() > 1 ? 'block' : 'none');

    const hidePayerRow = currentMode() === 'THEY_OWE_ALL';
    document.querySelectorAll('.participant-row').forEach(row => {
        const checkbox = row.querySelector('input[name="participantIds"]');
        const isPayer = checkbox && checkbox.value === payerId();
        row.style.display = (hidePayerRow && isPayer) ? 'none' : 'block';
    });
}

function refreshSplitUI() {
    // Each step is independent: a failure in one must not leave the
    // participants list in a stale state.
    [updateModeButtons, updateSplitTypeButtons, updateParticipantInputs, updateParticipantsVisibility]
        .forEach(step => {
            try {
                step();
            } catch (error) {
                console.error('Split UI refresh step failed:', error);
            }
        });
}

// Kept for backwards compatibility with the previous select-based UI.
function updateSplitUI() {
    refreshSplitUI();
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('paidById').addEventListener('change', updateParticipantsVisibility);
    document.querySelectorAll('input[name="participantIds"]').forEach(cb => {
        cb.addEventListener('change', updateParticipantInputs);
    });
    refreshSplitUI();
});
</script>
</body>
</html>
