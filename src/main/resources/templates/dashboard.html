<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/main :: head}">
    <title>Dashboard - SplitFriend</title>
</head>
<body>
<div th:replace="~{layout/main :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{layout/main :: alerts}"></div>

    <!-- Pinned loyalty cards: one tap to the card screen at the till -->
    <div class="dashboard-pinned-cards mb-3" th:unless="${#lists.isEmpty(pinnedCards)}">
        <a th:each="h : ${pinnedCards}" th:with="c=${h.card}"
           th:href="@{/cards/{id}(id=${c.id})}" class="dashboard-pinned-card text-decoration-none"
           th:title="${c.merchantName}">
            <span class="loyalty-tile-face" th:style="'background-color:' + ${c.color}">
                <img th:if="${c.hasLogo()}" th:src="@{/cards/{id}/logo(id=${c.id},v=${c.logoEtag})}"
                     th:alt="${c.merchantName}" loading="lazy">
                <span th:unless="${c.hasLogo()}" class="loyalty-tile-initials" th:style="'color:' + ${c.initialsColor}" th:text="${c.initials}">MT</span>
            </span>
            <span class="dashboard-pinned-name text-truncate" th:text="${c.merchantName}">Metro</span>
        </a>
        <a th:href="@{/cards}" class="dashboard-pinned-card dashboard-pinned-all text-decoration-none" th:title="#{cards.list.title}">
            <span class="loyalty-tile-face"><i class="bi bi-grid-3x3-gap"></i></span>
            <span class="dashboard-pinned-name text-truncate" th:text="#{dashboard.allCards}">All cards</span>
        </a>
    </div>

    <div class="row mb-4">
        <div class="col">
            <h2 class="d-flex align-items-center">
                <i class="bi bi-speedometer2 me-3 text-primary"></i>
                <span th:text="#{dashboard.welcome(${user.name})}">Welcome, User!</span>
            </h2>
            <p class="text-muted" th:text="#{dashboard.financialSummary}">Here's your financial summary across all groups</p>
        </div>
    </div>

    <!-- Balance Overview -->
    <div class="card mb-4">
        <div th:replace="~{fragments/balance-panel :: totals(${summary})}"></div>
        <div th:replace="~{fragments/balance-panel :: people(${summary})}"></div>
    </div>

    <!-- Groups Section -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="d-flex align-items-center mb-0">
            <i class="bi bi-people me-2"></i> <span th:text="#{dashboard.yourGroups}">Your Groups</span>
        </h4>
        <a th:href="@{/groups/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> <span th:text="#{dashboard.createGroup}">Create Group</span>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(groups)}" class="card">
        <div class="card-body empty-state">
            <i class="bi bi-people"></i>
            <h5 th:text="#{dashboard.noGroups}">No groups yet</h5>
            <p th:text="#{dashboard.createFirstGroup}">Create your first group to start tracking shared expenses</p>
            <a th:href="@{/groups/create}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> <span th:text="#{dashboard.createYourFirstGroup}">Create your first group</span>
            </a>
        </div>
    </div>

    <div class="row">
        <div th:each="group : ${groups}" class="col-md-6 col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex align-items-start mb-2">
                        <div class="icon-circle primary me-3">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="card-title mb-1" th:text="${group.name}">Group Name</h5>
                            <p class="card-text text-muted small mb-2" th:text="${group.description} ?: #{common.noDescription}">Description</p>
                        </div>
                    </div>
                    <div th:with="balance=${groupBalances.get(group.id)}">
                        <span th:if="${balance > 0}" class="balance-pill positive">
                            <i class="bi bi-arrow-down-short me-1"></i>
                            <span th:text="#{dashboard.owed}">Owed</span> $<span th:text="${#numbers.formatDecimal(balance, 1, 2)}">0.00</span>
                        </span>
                        <span th:if="${balance < 0}" class="balance-pill negative">
                            <i class="bi bi-arrow-up-short me-1"></i>
                            <span th:text="#{dashboard.owe}">Owe</span> $<span th:text="${#numbers.formatDecimal(balance.abs(), 1, 2)}">0.00</span>
                        </span>
                        <span th:if="${balance == 0}" class="balance-pill neutral">
                            <i class="bi bi-check-circle me-1"></i> <span th:text="#{dashboard.settledUp}">Settled up</span>
                        </span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 pt-0">
                    <a th:href="@{/groups/{id}(id=${group.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-eye me-1"></i> <span th:text="#{common.view}">View</span>
                    </a>
                    <a th:href="@{/expenses/add(groupId=${group.id})}" class="btn btn-success btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> <span th:text="#{dashboard.addExpense}">Add Expense</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
